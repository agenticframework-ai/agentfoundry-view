<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Model Intelligence: performance, economics and production benchmarking</title>
<style>
:root{--bg:#f4f5f6;--card:#fff;--ink:#1f2328;--mu:#66707a;--line:#e3e6e9;--lime:#c8ec7a;--limebg:#eef9cf;--limed:#4a7d00;--pri:#1f2328;--prit:#c8ec7a;--bad:#f6dedb;--badt:#9b2c20;--soft:#eceef0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111417;--card:#1a1f24;--ink:#eceff1;--mu:#9aa5ae;--line:#2b333a;--lime:#b6e35a;--limebg:#243314;--limed:#b6e35a;--pri:#c8ec7a;--prit:#1f2328;--bad:#3b2220;--badt:#f0a79d;--soft:#242b31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111417;--card:#1a1f24;--ink:#eceff1;--mu:#9aa5ae;--line:#2b333a;--lime:#b6e35a;--limebg:#243314;--limed:#b6e35a;--pri:#c8ec7a;--prit:#1f2328;--bad:#3b2220;--badt:#f0a79d;--soft:#242b31;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#root{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--limed);font-weight:700}
h1{font-size:clamp(22px,4vw,32px);line-height:1.15;margin:4px 0 12px;letter-spacing:-.02em}
h3{font-size:15px;margin:0 0 6px}
.banner{background:var(--limebg);border:1px solid var(--lime);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--prit);border-color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px}
.mu{color:var(--mu);font-size:12px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two .card{margin:0 0 0}.two{margin:0 0 14px}
.f{display:block}.f span{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}input.w{min-width:120px}input.n{min-width:70px;width:78px;padding:6px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;margin:4px 6px 0 0}
button.pri{background:var(--pri);color:var(--prit);border-color:var(--pri);font-weight:600}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chk{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}td.mu{white-space:normal;min-width:200px}th{color:var(--mu);font-weight:600;background:var(--soft)}
td.best{background:var(--limebg);font-weight:700}td.pass{background:var(--limebg)}td.fail{background:var(--bad);color:var(--badt)}td.worst{background:var(--bad);color:var(--badt);font-weight:600}
.src{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-weight:600;margin:0}
.s0{background:var(--soft)}.s1{background:var(--limebg);border-color:var(--lime);color:var(--limed)}.s2{background:var(--pri);color:var(--prit)}.src.sel{outline:2px solid var(--ink)}
.msg{background:var(--soft);border-radius:8px;padding:8px 12px;margin:0 0 12px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}.kpi{border:1px solid var(--line);border-top:4px solid;border-radius:10px;padding:10px 12px;background:var(--bg)}.kpi span{display:block;font-size:12px;color:var(--mu)}
.win{background:var(--limebg);border:1px solid var(--lime);border-radius:12px;padding:14px;margin:8px 0}.win b{display:block;font-size:18px}.win.bad{background:var(--bad);border-color:var(--badt)}
ul{margin:6px 0;padding-left:18px}
.ctx{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:13px}.ctx b{color:var(--mu);font-weight:600;margin-right:6px}
td.live{white-space:normal;min-width:170px;font-weight:600}
.recharts-cartesian-grid line,.recharts-polar-grid-concentric-polygon,.recharts-polar-grid-angle line{stroke:var(--line)}.recharts-text{fill:var(--mu)}
.recharts-default-tooltip{background:var(--card)!important;border-color:var(--line)!important}
.sl{margin:10px 0}.sl>div{display:flex;justify-content:space-between;font-size:13px}.sl input{padding:0;margin-top:4px;accent-color:var(--limed);background:transparent;border:0}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0}
.br{position:relative;display:flex;justify-content:space-between;font-size:13px;padding:5px 0 9px}.br i{position:absolute;left:0;bottom:3px;height:4px;background:var(--lime);border-radius:3px;max-width:100%}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}.mini small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.mini b{font-size:18px}.mini .mu{margin:2px 0 0;font-size:11px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.ch2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.ctl{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.ctl select{width:auto;min-width:200px}
summary{cursor:pointer}details.card summary{font-size:15px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
</style></head><body><div id="root"></div>
